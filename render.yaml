databases:
  - name: weblance-db
    databaseName: weblance_db_npkh
    user: weblance_db_user
    plan: free
    region: singapore

services:
  - type: web
    name: weblance
    runtime: python
    region: singapore
    plan: free
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn weblance_project.wsgi:application --workers 1 --timeout 300 --graceful-timeout 30 --bind 0.0.0.0:$PORT"
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: weblance-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SITE_URL
        value: "https://weblancehub.in"
      - key: ALLOWED_HOSTS
        value: "weblancehub.in,www.weblancehub.in,weblance-5u4i.onrender.com,weblance.onrender.com"
      - key: ADMIN_USER
        value: "balakrishna"
      - key: ADMIN_EMAIL
        value: "infoweblance01@gmail.com"
      - key: ADMIN_PASS
        value: "admin123"
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_HOST
        value: "smtp-relay.brevo.com"
      - key: EMAIL_PORT
        value: "2525"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: EMAIL_HOST_USER
        value: "adfd4b001@smtp-brevo.com"
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://weblancehub.in,https://www.weblancehub.in"
      - key: CLOUDINARY_CLOUD_NAME
        value: "dbbq1bl4u"
      - key: CLOUDINARY_API_KEY
        value: "416514896248622"
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ── Keep-alive cron: pings /health/ every 14 minutes to prevent cold starts ──
  - type: cron
    name: weblance-keepalive
    runtime: python
    region: singapore
    plan: free
    schedule: "*/14 * * * *"
    buildCommand: "pip install requests"
    startCommand: "python -c \"import requests; r = requests.get('https://weblancehub.in/health/', timeout=30); print('ping', r.status_code)\""
